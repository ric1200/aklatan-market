  <g>
    <rect x="40" y="252" width="150" height="22" rx="3" fill="#9C4A34"/>
    <rect x="48" y="230" width="134" height="22" rx="3" fill="#2C6E63"/>
    <rect x="44" y="208" width="142" height="22" rx="3" fill="#E0AC45"/>
    <rect x="52" y="186" width="126" height="22" rx="3" fill="#172B4D"/>
